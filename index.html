<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>⏺.uz</title>
  <meta name="description" content="⏺.uz">

  <style>
    :root {
      --bg: #f4f3ef;
      --fg: #111111;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      overflow: hidden;

      background: var(--bg);
      color: var(--fg);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    .site {
      position: relative;
      display: inline-block;
    }

    .domain {
      display: flex;
      align-items: flex-end;

      user-select: none;
      -webkit-user-select: none;
    }

    /* ─────────────────────────────
       THE DOT
       ───────────────────────────── */

    .dot {
      position: relative;

      width: min(46vw, 410px);
      height: min(46vw, 410px);

      min-width: 220px;
      min-height: 220px;

      border: 0;
      padding: 0;

      border-radius: 50%;
      background: var(--fg);

      cursor: pointer;

      overflow: hidden;

      -webkit-tap-highlight-color: transparent;

      transition:
        transform 600ms cubic-bezier(.16, 1, .3, 1);
    }

    .dot:hover {
      transform: scale(.985);
    }

    .dot:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 10px;
    }

    /* ─────────────────────────────
       .UZ
       ───────────────────────────── */

    .suffix {
      margin-left: 10px;
      margin-bottom: 25px;

      font-size: clamp(28px, 3.5vw, 46px);
      font-weight: 500;
      line-height: .9;

      letter-spacing: -.075em;

      transition:
        transform 600ms cubic-bezier(.16, 1, .3, 1),
        opacity 300ms ease;
    }

    /* ─────────────────────────────
       MENU
       ───────────────────────────── */

    .menu {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 12px;

      opacity: 0;
      pointer-events: none;

      transform: scale(.88);

      transition:
        opacity 250ms ease,
        transform 550ms cubic-bezier(.16, 1, .3, 1);
    }

    .menu a {
      position: relative;

      color: var(--bg);

      font-size: clamp(18px, 2vw, 27px);
      font-weight: 450;
      line-height: 1.15;

      letter-spacing: -.045em;
      text-decoration: none;

      opacity: .55;

      transform: translateY(5px);

      transition:
        opacity 180ms ease,
        transform 250ms cubic-bezier(.16, 1, .3, 1);
    }

    .menu a:hover,
    .menu a:focus-visible {
      opacity: 1;
      transform: translateX(6px);
    }

    .menu a:focus-visible {
      outline: none;
    }

    /* небольшая задержка делает появление живее */

    .menu a:nth-child(1) {
      transition-delay: 0ms;
    }

    .menu a:nth-child(2) {
      transition-delay: 20ms;
    }

    .menu a:nth-child(3) {
      transition-delay: 40ms;
    }

    .menu a:nth-child(4) {
      transition-delay: 60ms;
    }

    /* ─────────────────────────────
       OPEN STATE
       ───────────────────────────── */

    .site.open .dot {
      transform: scale(.91);
    }

    .site.open .suffix {
      transform: translateX(-8px);
    }

    .site.open .menu {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .site.open .menu a {
      transform: translateY(0);
    }

    .site.open .menu a:hover,
    .site.open .menu a:focus-visible {
      transform: translateX(6px);
    }

    /* ─────────────────────────────
       MOBILE
       ───────────────────────────── */

    @media (max-width: 700px) {
      .dot {
        width: 66vw;
        height: 66vw;

        min-width: 0;
        min-height: 0;
      }

      .suffix {
        margin-left: 7px;
        margin-bottom: 16px;

        font-size: clamp(25px, 7vw, 34px);
      }

      .menu {
        gap: 9px;
      }

      .menu a {
        font-size: clamp(17px, 5vw, 22px);
      }
    }

    /* Очень узкие экраны */

    @media (max-width: 380px) {
      .dot {
        width: 63vw;
        height: 63vw;
      }

      .suffix {
        margin-left: 5px;
        margin-bottom: 12px;
      }
    }

    /* Не анимируем, если пользователь отключил анимации */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="site" id="site">

    <div class="domain">

      <button
        class="dot"
        id="dot"
        type="button"
        aria-label="Открыть меню"
        aria-expanded="false"
      >

        <nav class="menu" aria-label="Навигация">

          <a href="/projects">
            projects
          </a>

          <a href="/lab">
            lab
          </a>

          <a
            href="https://github.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            git
          </a>

          <a href="/status">
            status
          </a>

        </nav>

      </button>

      <div class="suffix">
        .uz
      </div>

    </div>

  </main>

  <script>
    const site = document.getElementById("site");
    const dot = document.getElementById("dot");

    function setOpen(open) {
      site.classList.toggle("open", open);

      dot.setAttribute(
        "aria-expanded",
        open ? "true" : "false"
      );

      dot.setAttribute(
        "aria-label",
        open ? "Закрыть меню" : "Открыть меню"
      );
    }

    dot.addEventListener("click", event => {
      /*
       * Если кликнули по ссылке внутри точки,
       * не закрываем/открываем меню повторно.
       */
      if (event.target.closest("a")) {
        return;
      }

      setOpen(!site.classList.contains("open"));
    });

    /*
     * Клик мимо точки закрывает меню.
     */
    document.addEventListener("pointerdown", event => {
      if (!site.contains(event.target)) {
        setOpen(false);
      }
    });

    /*
     * Escape закрывает.
     */
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        setOpen(false);
        dot.focus();
      }
    });
  </script>

</body>
</html>
